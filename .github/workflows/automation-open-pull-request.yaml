---
name: Open Pull Request when an `auto-pr` is pushed
on:
  push:
    branches:
      - 'auto-pr/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: "Open a pull request (No Checkout)"
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh pr view "$BRANCH" --repo "$REPO" >/dev/null 2>&1; then
            echo "Pull request for $BRANCH already exists."
            exit 0
          fi
          gh pr create \
            --repo "$REPO" \
            --title "Auto PR: Regenerating the Go SDK (${SHA})" \
            --body "Regenerating the SDK based on the latest changes" \
            --base "main" \
            --head "$BRANCH" \
            --label "release-once-merged"
