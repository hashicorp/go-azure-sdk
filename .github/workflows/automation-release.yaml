---
name: Conditionally Release the SDK
on:
  pull_request:
    types: ['closed']
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  test:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'release-once-merged')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: custom-linux-xl
    strategy:
      fail-fast: false
      matrix:
        component: [sdk, resource-manager, microsoft-graph, data-plane]
    steps:
      - name: Mount RAM Disks
        run: |
          sudo mount -t tmpfs -o size=16G tmpfs "${{ github.workspace }}"
          sudo chown -R "$USER:$USER" "${{ github.workspace }}"
          mkdir -p ~/.cache/go-build ~/go/pkg/mod
          sudo mount -t tmpfs -o size=8G tmpfs ~/.cache/go-build
          sudo mount -t tmpfs -o size=8G tmpfs ~/go/pkg/mod
          sudo chown -R "$USER:$USER" ~/.cache/go-build ~/go/pkg/mod

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ./.go-version

      - name: run the unit tests
        run: make test-ci-${{ matrix.component }}

      - name: Unmount RAM Disks
        if: always()
        run: |
          cd /
          sudo umount -l ~/.cache/go-build || true
          sudo umount -l ~/go/pkg/mod || true
          sudo umount -l "${{ github.workspace }}" || true

  release-go-sdk:
    needs: [test]
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'release-once-merged')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: custom-linux-medium
    environment: automation-production
    outputs:
      latest_tag: ${{ steps.version-number.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ./.go-version

      - id: version-number
        name: "Determining the Version Number.."
        run: |
          latestTag=$(./scripts/determine-git-tag.sh)
          echo "latest_tag=$latestTag" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Publish the Git Tag"
        env:
          LATEST_TAG: ${{ steps.version-number.outputs.latest_tag }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOYMENT_WRITE_KEY }}
        run: |
          ./scripts/publish-git-tag.sh "$LATEST_TAG"
        shell: bash
