---
name: Conditionally Release the SDK
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Single static group serialises all releases. At most one pending run is queued,
  # which is safe because a newer main commit supersedes an older pending commit.
  group: 'release-go-sdk'
  cancel-in-progress: false

jobs:
  should-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        name: "Check if commit requires a release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_label=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .labels[].name] | index("release-once-merged") != null')
          if [[ "$has_label" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [should-release]
    if: needs.should-release.outputs.release == 'true'
    runs-on: custom-linux-xl
    strategy:
      fail-fast: false
      matrix:
        component: [sdk, resource-manager, microsoft-graph, data-plane]
    steps:
      - name: Mount RAM Disks
        run: |
          sudo mount -t tmpfs -o size=16G tmpfs "${{ github.workspace }}"
          sudo chown -R "$USER:$USER" "${{ github.workspace }}"
          mkdir -p ~/.cache/go-build ~/go/pkg/mod
          sudo mount -t tmpfs -o size=8G tmpfs ~/.cache/go-build
          sudo mount -t tmpfs -o size=8G tmpfs ~/go/pkg/mod
          sudo chown -R "$USER:$USER" ~/.cache/go-build ~/go/pkg/mod

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ./.go-version

      - name: run the unit tests
        run: make test-ci-${{ matrix.component }}

      - name: Unmount RAM Disks
        if: always()
        run: |
          cd /
          sudo umount -l ~/.cache/go-build || true
          sudo umount -l ~/go/pkg/mod || true
          sudo umount -l "${{ github.workspace }}" || true

  release-go-sdk:
    needs: [should-release, test]
    if: needs.should-release.outputs.release == 'true'
    runs-on: custom-linux-medium
    environment: automation-production
    permissions:
      contents: write
    outputs:
      latest_tag: ${{ steps.version-number.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: version-number
        name: "Determining the Version Number.."
        run: |
          latestTag=$(./scripts/determine-git-tag.sh)
          echo "latest_tag=$latestTag" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Publish the Git Tags (Tag-Only Release)"
        env:
          LATEST_TAG: ${{ steps.version-number.outputs.latest_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ./scripts/publish-git-tag.sh "$LATEST_TAG"
        shell: bash
