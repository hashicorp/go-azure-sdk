---
name: Acceptance Tests
on:
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - ".github/workflows/pr-acceptance-tests.yml"
      - "sdk/**.go"

permissions:
  contents: read

jobs:
  acceptance-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: acceptance-tests
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set OIDC Token
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Accept: application/json; api-version=2.0" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" -H "Content-Type: application/json" -G --data-urlencode "audience=api://AzureADTokenExchange" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::Failed to obtain OIDC token from GitHub Actions." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "ARM_OIDC_TOKEN=$token" >> "${GITHUB_ENV}"

      - name: Azure CLI login
        env:
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        run: az login --allow-no-subscriptions --output none --service-principal --tenant="$ARM_TENANT_ID" --username="$ARM_CLIENT_ID" --federated-token="$ARM_OIDC_TOKEN"

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ./.go-version
          cache-dependency-path: sdk/go.sum

      - name: Run acceptance tests
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_CERTIFICATE: ${{ secrets.ARM_CLIENT_CERTIFICATE }}
          ARM_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.ARM_CLIENT_CERTIFICATE_PASSWORD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_MSI_TOKEN: ${{ secrets.ARM_MSI_TOKEN }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: make acctest

